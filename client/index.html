    <style>
      /* Navy splash, Ashaley-style: crest pops in while two gradient arc rings spin around it.
         Visible from the very first byte — the crest is embedded (base64), so it needs NO extra request. */
      #splash { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem;
        background:
          radial-gradient(60vmax 60vmax at 50% 45%, rgba(246,178,26,.16), rgba(246,178,26,0) 62%),
          linear-gradient(160deg, #1b3560 0%, #12243d 48%, #070f22 100%);
        transition: opacity .6s ease, visibility .6s ease; }
      #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash .al-wrap { position: relative; width: min(64vw, 300px); aspect-ratio: 1; }
      #splash .al-badge { position: absolute; left: 50%; top: 50%; height: 68%; width: auto; max-width: 80%; object-fit: contain;
        transform: translate(-50%, -50%); animation: al-pop .7s ease-out both;
        filter: drop-shadow(0 10px 24px rgba(2, 6, 20, .55)) drop-shadow(0 0 34px rgba(246,178,26,.28)); }
      #splash svg.al-ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #splash .al-spin-a { transform-origin: 50% 50%; animation: al-spin 1.7s linear infinite; }
      #splash .al-spin-b { transform-origin: 50% 50%; animation: al-spin 2.6s linear infinite reverse; }
      @keyframes al-spin { to { transform: rotate(360deg); } }
      @keyframes al-pop { from { opacity: 0; transform: translate(-50%, -50%) scale(.86); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
      .splash-name { margin: 0; font-family: Fraunces, Georgia, serif; font-size: 1.35rem; font-weight: 600; color: #ffffff; text-align: center; }
      .splash-tag { margin: 0; font-family: system-ui, -apple-system, sans-serif; font-size: .6rem; font-weight: 700; letter-spacing: .42em; text-transform: uppercase; color: #f6b21a; text-indent: .42em; }
      /* The loader is feedback, not decoration: with reduce-motion it still turns, just more slowly */
      @media (prefers-reduced-motion: reduce) {
        #splash .al-spin-a { animation-duration: 4s !important; animation-iteration-count: infinite !important; }
        #splash .al-spin-b { animation-duration: 6s !important; animation-iteration-count: infinite !important; }
      }
    </style>

    <script>
      /* The splash ends ONLY when every asset has been retrieved (window "load":
         images, fonts, CSS, JS) AND React has painted. A 10s absolute safety cap
         prevents a hanging asset from trapping anyone on the splash screen. */
      (function () {
        var state = { assets: false, react: false, done: false };
        var hide = function () {
          var el = document.getElementById("splash");
          if (!el) return;
          el.classList.add("hide");
          window.setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 550);
        };
        var maybeFinish = function () {
          if (state.done) return;
          if (!state.assets || !state.react) return;
          state.done = true;
          hide();
        };
        var markAssets = function () { state.assets = true; maybeFinish(); };
        window.__splashMarkAssets = markAssets;
        window.__splashMarkReact = function () { state.react = true; maybeFinish(); };
        if (document.readyState === "complete") markAssets();
        else window.addEventListener("load", markAssets);
        window.setTimeout(function () { state.assets = true; state.react = true; maybeFinish(); }, 10000); // absolute safety cap
      })();
    </script>
