    <meta charset="UTF-8" />

    <!-- Social preview cards (WhatsApp, Facebook, LinkedIn, Discord, Slack, X…) -->

    <style>
      /* Navy splash with the school crest — shows instantly, JS removes it (max 2s) */
      #splash { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem; background: radial-gradient(120% 120% at 50% 12%, #1b3560 0%, #12243d 48%, #0a1730 100%); transition: opacity .45s ease, visibility .45s ease; }
      #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash img { width: 104px; height: 104px; border-radius: 26px; box-shadow: 0 0 0 1px rgba(246,178,26,.4), 0 18px 50px rgba(0,0,0,.45), 0 0 70px rgba(246,178,26,.25); animation: splash-breathe 1.7s ease-in-out infinite; }
      @keyframes splash-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      .splash-name { margin: .5rem 0 0; font-family: Fraunces, Georgia, serif; font-size: 1.35rem; font-weight: 600; color: #ffffff; text-align: center; }
      .splash-tag { margin: 0; font-family: system-ui, -apple-system, sans-serif; font-size: .6rem; font-weight: 700; letter-spacing: .42em; text-transform: uppercase; color: #f6b21a; text-indent: .42em; }
      .splash-bar { width: 150px; height: 3px; margin-top: .35rem; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
      .splash-bar span { display: block; height: 100%; width: 42%; border-radius: 999px; background: linear-gradient(90deg, transparent, #f6b21a 35%, #ffd95e 55%, #f6b21a 70%, transparent); animation: splash-slide 1.15s ease-in-out infinite; }
      @keyframes splash-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
      @media (prefers-reduced-motion: reduce) { #splash img, .splash-bar span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/apple-touch-icon.png" alt="" width="104" height="104" />
      <p class="splash-name">Jireh International School</p>
      <p class="splash-tag">Quality for Success</p>
      <div class="splash-bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
