    <style>
      /* Navy splash with the crest + spinning arc rings — hidden only when ALL assets are loaded */
      #splash { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem; background: radial-gradient(120% 120% at 50% 12%, #1b3560 0%, #12243d 48%, #0a1730 100%); transition: opacity .5s ease, visibility .5s ease; }
      #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-emblem { position: relative; width: 212px; height: 212px; display: flex; align-items: center; justify-content: center; }
      .splash-emblem svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .splash-track { fill: none; stroke: rgba(255,255,255,.13); stroke-width: 3; }
      .splash-arc { fill: none; stroke-linecap: round; }
      .splash-spin { transform-origin: 106px 106px; animation: splash-rotate 1.5s linear infinite; }
      @keyframes splash-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      #splash img { height: 118px; width: auto; background: transparent; filter: drop-shadow(0 0 26px rgba(246,178,26,.35)) drop-shadow(0 10px 30px rgba(0,0,0,.5)); animation: splash-breathe 1.7s ease-in-out infinite; position: relative; z-index: 1; }
      @keyframes splash-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      .splash-name { margin: .4rem 0 0; font-family: Fraunces, Georgia, serif; font-size: 1.35rem; font-weight: 600; color: #ffffff; text-align: center; }
      .splash-tag { margin: 0; font-family: system-ui, -apple-system, sans-serif; font-size: .6rem; font-weight: 700; letter-spacing: .42em; text-transform: uppercase; color: #f6b21a; text-indent: .42em; }
      @media (prefers-reduced-motion: reduce) { #splash img, .splash-spin { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true" role="status">
      <div class="splash-emblem">
        <svg viewBox="0 0 212 212" aria-hidden="true">
          <circle class="splash-track" cx="106" cy="106" r="88" />
          <g class="splash-spin">
            <circle class="splash-arc" cx="106" cy="106" r="88" stroke="#f6b21a" stroke-width="5" stroke-dasharray="130 423" stroke-dashoffset="0" />
            <circle class="splash-arc" cx="106" cy="106" r="88" stroke="rgba(255,255,255,.95)" stroke-width="5" stroke-dasharray="52 501" stroke-dashoffset="-175" />
            <circle class="splash-arc" cx="106" cy="106" r="88" stroke="#ffd95e" stroke-width="5" stroke-dasharray="28 525" stroke-dashoffset="-300" />
          </g>
        </svg>
        <img src="/images/crest-splash.png" alt="" height="118" />
      </div>
      <p class="splash-name">Jireh International School</p>
      <p class="splash-tag">Quality for Success</p>
    </div>
    <script>
      /* The splash ends ONLY when every asset has been retrieved (window "load":
         images, fonts, CSS, JS) AND React has painted. A 10s absolute safety cap
         prevents a hanging asset from trapping anyone on the splash screen. */
      (function () {
        var state = { assets: false, react: false, done: false };
        var hide = function () {
          var el = document.getElementById("splash");
          if (!el) return;
          el.classList.add("hide");
          window.setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 550);
        };
        var maybeFinish = function () {
          if (state.done) return;
          if (!state.assets || !state.react) return;
          state.done = true;
          hide();
        };
        var markAssets = function () { state.assets = true; maybeFinish(); };
        window.__splashMarkAssets = markAssets;
        window.__splashMarkReact = function () { state.react = true; maybeFinish(); };
        if (document.readyState === "complete") markAssets();
        else window.addEventListener("load", markAssets);
        window.setTimeout(function () { state.assets = true; state.react = true; maybeFinish(); }, 10000); // absolute safety cap
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
